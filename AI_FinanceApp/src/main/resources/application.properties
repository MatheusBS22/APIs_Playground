spring.application.name=AI_FinanceApp

# Banco H2 em memória, só para desenvolvimento/teste local.
# Os dados somem a cada restart -- trocar por Postgres/Neon antes de produção.
spring.datasource.url=jdbc:h2:mem:borabrincar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades.
# Trocar para 'validate' quando o esquema estiver estável, para não perder dado por acidente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# Integração com a API do Grok (xAI). A chave nunca fica hardcoded aqui --
# vem da variável de ambiente GROK_API_KEY, configurada no painel do Render.
# O erro "Incorrect API key provided" é literal: a env var GROK_API_KEY precisa ter uma
# chave real gerada em https://console.x.ai -- sem isso a chamada nunca vai funcionar,
# não importa o que mais for ajustado no código.
# "grok-4.6" também não é um nome de modelo válido da xAI -- troquei o default para
# grok-4-fast-reasoning (suporta function calling e é o mais barato). Confira em
# https://console.x.ai quais modelos sua conta tem liberados; dá pra sobrescrever via
# env var XAI_MODEL sem precisar mexer no código.
xai.api.key=${GROK_API_KEY:}
xai.base-url=https://api.x.ai/v1/chat/completions
xai.model=${XAI_MODEL:grok-4-fast-reasoning}
