spring.application.name=AI_FinanceApp

# Postgres na Neon. URL, usuário e senha vem de variáveis de ambiente
# configuradas no painel do Render -- nunca hardcoded aqui.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

# Integração com a API da Groq (groq.com -- nada a ver com o Grok da xAI, mesmo nome
# parecido). A chave nunca fica hardcoded aqui -- vem da variável de ambiente
# GROQ_API_KEY, configurada no painel do Render, gerada em https://console.groq.com.
# A API da Groq é compatível com o formato OpenAI (mesmo formato que a xAI usava),
# então os DTOs Grok*.java continuam funcionando sem alteração -- só muda a URL,
# a chave e o nome do modelo.
# llama-3.3-70b-versatile é o modelo com suporte a function calling no tier gratuito.
# Dá pra sobrescrever via env var GROQ_MODEL sem precisar mexer no código.
xai.api.key=${GROQ_API_KEY:}
xai.base-url=https://api.groq.com/openai/v1/chat/completions
xai.model=openai/gpt-oss-120b
