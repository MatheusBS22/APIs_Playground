spring.application.name=AI_FinanceApp

# Banco H2 em memória, só para desenvolvimento/teste local.
# Os dados somem a cada restart -- trocar por Postgres/Neon antes de produção.
spring.datasource.url=jdbc:h2:mem:borabrincar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades.
# Trocar para 'validate' quando o esquema estiver estável, para não perder dado por acidente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
